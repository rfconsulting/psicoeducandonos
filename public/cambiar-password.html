<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cambiar contraseña · Psicoeducándonos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><script src="password.js" defer></script></head>
<body><div class="auth-shell"><aside class="auth-aside"><a class="brand" href="/"><img src="assets/logo.png" alt=""><span>Psicoeducándonos</span></a><div class="auth-message"><span>Acción requerida</span><h1>Crea una contraseña <em>personal.</em></h1><p>La contraseña temporal fue creada por un administrador. Debes reemplazarla antes de entrar al sistema.</p></div><small>La sesión se cerrará al terminar.</small></aside><main class="auth-main"><section class="auth-card"><h2>Cambiar contraseña</h2><form data-password-form="change"><div class="field"><label for="currentPassword">Contraseña temporal</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="72" required></div><div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div><div class="field"><label for="confirmation">Confirmar contraseña</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div><p class="form-message" role="alert"></p><button class="submit-button" type="submit">Guardar nueva contraseña</button></form></section></main></div></body></html>
